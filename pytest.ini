[pytest]
testpaths = tests
addopts = -v --strict-markers
markers =
    unitaria: prueba de una unidad aislada (clase o función)
    integracion: prueba de la interacción entre varios módulos
    aceptacion: prueba de aceptación del usuario (historia de usuario)
    caja_negra: técnica de caja negra (entradas y salidas)
    caja_blanca: técnica de caja blanca (recorre ramas del código)
    valor_limite: técnica de análisis de valores límite
    estado: técnica de prueba de estado (antes y después)
    robustez: pruebas de robustez y manejo de fallas (Actividad 4)
    mutacion: pruebas escritas a partir de mutantes sobrevivientes (Laboratorio 3)
    rendimiento: pruebas de rendimiento y carga (Laboratorio 3)
