# Corre todas las pruebas (unitarias, integración y aceptación) en cada push o pull request.
name: Pruebas de la tienda

on:
  push:
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Estilo, pruebas con cobertura y rendimiento (las mismas sesiones de nox que en el computador)
        run: nox
      - name: Guardar reportes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes
          path: reportes/
