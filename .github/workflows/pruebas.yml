# Corre todas las pruebas (unitarias, integración y aceptación) en cada push o pull request.
name: Pruebas de la tienda

on:
  push:
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Ejecutar pruebas con cobertura de líneas y ramas
        run: pytest --cov=tienda --cov-branch --cov-report=term-missing --cov-fail-under=100 --cucumberjson=cucumber.json
      - name: Generar reporte de aceptación
        if: always()
        run: python reporte_aceptacion.py cucumber.json reporte_aceptacion.html
      - name: Guardar reporte
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-aceptacion
          path: reporte_aceptacion.html
